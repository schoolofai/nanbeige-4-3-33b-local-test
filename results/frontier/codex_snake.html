<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101820;
      color: #eef7ed;
      font-family: system-ui, sans-serif;
    }
    main {
      width: min(94vw, 520px);
      padding: 20px;
      text-align: center;
    }
    h1 { margin: 0 0 12px; }
    .stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 18px;
      font-weight: 600;
    }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      background: #16242d;
      border: 2px solid #38505b;
      border-radius: 8px;
    }
    p {
      color: #b7c7cc;
      line-height: 1.6;
      margin-bottom: 0;
    }
    kbd {
      padding: 2px 5px;
      border-radius: 4px;
      background: #293d48;
      color: #fff;
    }
  </style>
</head>
<body>
  <main>
    <h1>Snake</h1>
    <div class="stats" aria-live="polite">
      <span>Score: <span id="score">0</span></span>
      <span>Speed: <span id="speed">1</span></span>
    </div>
    <canvas id="board" width="600" height="600"
      role="img" aria-label="Snake game on a 20 by 20 grid"></canvas>
    <p id="status" aria-live="polite">Eat the red food. Avoid walls and yourself.</p>
    <p>Steer with <kbd>Arrow keys</kbd> or <kbd>WASD</kbd><br>
      Press <kbd>Space</kbd> to restart</p>
  </main>

  <script>
    "use strict";

    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const speedElement = document.getElementById("speed");
    const statusElement = document.getElementById("status");

    const GRID = 20;
    const CELL = canvas.width / GRID;
    const directions = {
      arrowup:    { x: 0, y: -1 },
      w:          { x: 0, y: -1 },
      arrowdown:  { x: 0, y: 1 },
      s:          { x: 0, y: 1 },
      arrowleft:  { x: -1, y: 0 },
      a:          { x: -1, y: 0 },
      arrowright: { x: 1, y: 0 },
      d:          { x: 1, y: 0 }
    };

    let snake, direction, nextDirection, food, score;
    let ended, won, turnQueued, timer;

    function interval() {
      return Math.max(55, 150 - Math.floor(score / 5) * 8);
    }

    function placeFood() {
      const empty = [];
      for (let y = 0; y < GRID; y++) {
        for (let x = 0; x < GRID; x++) {
          if (!snake.some(segment => segment.x === x && segment.y === y)) {
            empty.push({ x, y });
          }
        }
      }
      return empty.length
        ? empty[Math.floor(Math.random() * empty.length)]
        : null;
    }

    function restart() {
      clearTimeout(timer);
      snake = [
        { x: 9, y: 10 },
        { x: 8, y: 10 },
        { x: 7, y: 10 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = direction;
      score = 0;
      ended = false;
      won = false;
      turnQueued = false;
      food = placeFood();
      scoreElement.textContent = score;
      speedElement.textContent = "1";
      statusElement.textContent = "Eat the red food. Avoid walls and yourself.";
      draw();
      timer = setTimeout(tick, interval());
    }

    function finish(victory = false) {
      ended = true;
      won = victory;
      statusElement.textContent = victory
        ? "You filled the board! Press Space to play again."
        : "Game over! Press Space to restart.";
      draw();
    }

    function tick() {
      if (ended) return;

      direction = nextDirection;
      turnQueued = false;

      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };
      const eating = head.x === food.x && head.y === food.y;

      // The tail moves away this turn unless the snake is growing.
      const occupied = eating ? snake : snake.slice(0, -1);
      const collision =
        head.x < 0 || head.x >= GRID ||
        head.y < 0 || head.y >= GRID ||
        occupied.some(segment => segment.x === head.x && segment.y === head.y);

      if (collision) {
        finish();
        return;
      }

      snake.unshift(head);
      if (eating) {
        score++;
        scoreElement.textContent = score;
        speedElement.textContent = Math.floor(score / 5) + 1;
        food = placeFood();
        if (!food) {
          finish(true);
          return;
        }
      } else {
        snake.pop();
      }

      draw();
      timer = setTimeout(tick, interval());
    }

    function draw() {
      ctx.fillStyle = "#16242d";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "#20333e";
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 1; i < GRID; i++) {
        ctx.moveTo(i * CELL, 0);
        ctx.lineTo(i * CELL, canvas.height);
        ctx.moveTo(0, i * CELL);
        ctx.lineTo(canvas.width, i * CELL);
      }
      ctx.stroke();

      if (food) {
        ctx.fillStyle = "#ff6473";
        ctx.beginPath();
        ctx.arc(
          (food.x + 0.5) * CELL,
          (food.y + 0.5) * CELL,
          CELL * 0.34, 0, Math.PI * 2
        );
        ctx.fill();
      }

      snake.forEach((segment, index) => {
        ctx.fillStyle = index === 0 ? "#c1ff83" : "#79d45b";
        ctx.fillRect(
          segment.x * CELL + 2,
          segment.y * CELL + 2,
          CELL - 4,
          CELL - 4
        );
      });

      if (ended) {
        ctx.fillStyle = "rgba(8, 16, 22, 0.82)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 44px system-ui, sans-serif";
        ctx.fillText(won ? "You win!" : "Game over", 300, 255);
        ctx.font = "24px system-ui, sans-serif";
        ctx.fillText(`Score: ${score}`, 300, 310);
        ctx.font = "20px system-ui, sans-serif";
        ctx.fillText("Press Space to restart", 300, 355);
      }
    }

    document.addEventListener("keydown", event => {
      const key = event.key.toLowerCase();

      if (event.code === "Space" || key === " ") {
        event.preventDefault();
        if (!event.repeat) restart();
        return;
      }

      const requested = directions[key];
      if (!requested) return;
      event.preventDefault();

      if (ended || turnQueued) return;
      if (requested.x === -direction.x && requested.y === -direction.y) return;
      if (requested.x === direction.x && requested.y === direction.y) return;

      nextDirection = requested;
      turnQueued = true;
    });

    restart();
  </script>
</body>
</html>
